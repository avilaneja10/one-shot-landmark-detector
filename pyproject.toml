[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oneshotlandmark"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "tqdm",
    "transformers",
    "Pillow",
    "huggingface_hub",
    "cp4icl"
]

[tool.setuptools.packages.find]
where = ["src"]